<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Marketplace &amp; Discovery — CampusChop | DELSU Abraka</title>
  <meta name="description" content="Browse meals from approved restaurants and food vendors across DELSU campus and Abraka town. Filter by category, price, and vendor.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/marketplace.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <!-- Header / Navbar Mount -->
  <header id="navbar-mount"></header>

  <main style="padding: 2.5rem 0 4rem;">
    <div class="container">
      <!-- Page Header -->
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2.25rem; margin-bottom: 0.5rem;">Explore Campus Food</h1>
        <p style="color: var(--text-secondary); font-size: 1.05rem;">
          Discover delicious meals, snacks and drinks from approved vendors across DELSU &amp; Abraka.
        </p>
      </div>

      <!-- Filter Controls Bar -->
      <div class="card card-body" style="margin-bottom: 2rem; background: var(--bg-card);">
        <div style="display: grid; grid-template-columns: 1fr; gap: 1rem;">
          <!-- Search Bar -->
          <div class="hero-search-input-wrap" style="background: var(--bg-alt); border-radius: var(--radius-md); padding: 0.75rem 1rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="market-search" placeholder="Search by meal name or vendor (e.g. jollof, Mama Put, shawarma)...">
          </div>

          <!-- Secondary Filters Row -->
          <div style="display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between;">
            <div style="display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; flex: 1;">
              <!-- Vendor Dropdown Filter -->
              <select id="market-vendor-filter" class="form-control" style="width: auto; min-width: 180px; padding: 0.5rem 0.85rem; font-size: 0.9rem;">
                <option value="all">All Vendors</option>
              </select>

              <!-- Price Sort Dropdown -->
              <select id="market-sort-filter" class="form-control" style="width: auto; min-width: 180px; padding: 0.5rem 0.85rem; font-size: 0.9rem;">
                <option value="latest">Sort: Latest Additions</option>
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
              </select>
            </div>

            <div style="font-size: 0.9rem; color: var(--text-muted); font-weight: 600;" id="results-count">
              Showing meals...
            </div>
          </div>
        </div>
      </div>

      <!-- Category Filter Pills -->
      <div class="categories-bar" id="market-categories-bar" style="margin-bottom: 2rem;">
        <button class="category-chip active" data-slug="all">All Categories</button>
      </div>

      <!-- Tab Switcher: Meals vs Vendors View -->
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1.75rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem;">
        <button id="view-meals-tab" class="btn btn-sm btn-primary" style="border-radius: var(--radius-sm);">
          🍱 Meals &amp; Dishes
        </button>
        <button id="view-vendors-tab" class="btn btn-sm btn-outline" style="border-radius: var(--radius-sm);">
          🏪 Approved Vendors
        </button>
      </div>

      <!-- Meals View Container -->
      <div id="meals-view">
        <div class="grid-cards" id="market-meals-grid">
          <!-- Skeletons -->
          <div class="product-card skeleton" style="height:320px;"></div>
          <div class="product-card skeleton" style="height:320px;"></div>
          <div class="product-card skeleton" style="height:320px;"></div>
          <div class="product-card skeleton" style="height:320px;"></div>
        </div>
      </div>

      <!-- Vendors View Container -->
      <div id="vendors-view" style="display: none;">
        <div class="grid-cards" id="market-vendors-grid">
          <!-- Skeletons -->
          <div class="vendor-card skeleton" style="height:260px;"></div>
          <div class="vendor-card skeleton" style="height:260px;"></div>
          <div class="vendor-card skeleton" style="height:260px;"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Mount -->
  <footer id="footer-mount"></footer>

  <script type="module" src="/js/pages/marketplace.js"></script>
</body>
</html>
