<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CampusChop | DELSU Abraka Marketplace</title>
  <meta name="description" content="Sign in to your CampusChop account to order food, track orders or manage your DELSU campus food store.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <!-- Header / Navbar Mount -->
  <header id="navbar-mount"></header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-badge">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
          </svg>
        </div>
        <h1>Welcome back</h1>
        <p>Log in to your CampusChop account</p>
      </div>

      <!-- Alert Message Box -->
      <div id="login-alert" class="auth-alert auth-alert-error">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="login-alert-text">Error message</span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address <span class="req">*</span></label>
          <input type="email" id="login-email" class="form-control" placeholder="e.g. student@delsu.edu.ng" required autofocus>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label" for="login-password" style="margin: 0;">Password <span class="req">*</span></label>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
          Sign In
        </button>
      </form>

      <div class="auth-divider">
        <span>NEW TO CAMPUSCHOP?</span>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
        <a href="/register.html?role=customer" class="btn btn-outline btn-sm" style="text-align: center;">
          Create Student Account
        </a>
        <a href="/register.html?role=vendor" class="btn btn-outline btn-sm" style="text-align: center;">
          Become a Vendor
        </a>
      </div>
    </div>
  </main>

  <!-- Footer Mount -->
  <footer id="footer-mount"></footer>

  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
